[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "astro dev"
  port = 8888
  targetPort = 4321
  framework = "astro"

# HTTP → HTTPS (301)
[[redirects]]
  from   = "http://aplustheorie.nl/*"
  to     = "https://aplustheorie.nl/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.aplustheorie.nl/*"
  to     = "https://aplustheorie.nl/:splat"
  status = 301
  force  = true

# www → apex (301)
[[redirects]]
  from   = "https://www.aplustheorie.nl/*"
  to     = "https://aplustheorie.nl/:splat"
  status = 301
  force  = true
