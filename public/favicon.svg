<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="white"/>
  <!-- Outer blue ring -->
  <circle cx="32" cy="32" r="30" stroke="#1452CC" stroke-width="4"/>
  <!-- Inner gold ring -->
  <circle cx="32" cy="32" r="24" stroke="#E8A020" stroke-width="2.5"/>
  <!-- A -->
  <text x="30" y="46"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="28"
        font-weight="900"
        fill="#1452CC"
        text-anchor="middle">A</text>
  <!-- + -->
  <text x="48" y="38"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="20"
        font-weight="900"
        fill="#E8A020"
        text-anchor="middle">+</text>
</svg>
