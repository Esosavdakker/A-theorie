<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- White background -->
  <circle cx="32" cy="32" r="31" fill="white"/>
  <!-- Blue outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#0066CC" stroke-width="4.5"/>
  <!-- Orange inner ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f97316" stroke-width="3"/>
  <!-- A (blue, bold) -->
  <text x="29" y="44"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="30"
        font-weight="900"
        fill="#0066CC"
        text-anchor="middle">A</text>
  <!-- + (orange, superscript) -->
  <text x="47" y="35"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="20"
        font-weight="900"
        fill="#f97316"
        text-anchor="middle">+</text>
</svg>
